[package]
name = "lang-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lsp-types = "0.97.0"
tokio = { version = "1.43.1", default-features=false, features = ["macros" ] }
tower-lsp = "0.20.0"
serde_json = { version = "1.0.151",default-features=false}
backend = {path = "../backend"}
frontend = {path = "../frontend/"}
ir = {path = "../ir/"}
chumsky = {workspace=true}

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }

[features]
default = ["tokio/io-std", "tokio/rt-multi-thread"]

