[package]
name = "lang-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lsp-types = "0.97.0"
tokio = { version = "1.43.1", default-features=false, features = ["macros" ] }
tower-lsp = "0.20.0"
lang-model= { path = "../lang-model"}
tree-sitter-mumps = { path = "../tree-sitter-M"}
tree-sitter = {workspace=true}

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }

[features]
default = ["tokio/io-std", "tokio/rt-multi-thread"]

