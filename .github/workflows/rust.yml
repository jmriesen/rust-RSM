name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          fetch-depth: 0
    - uses: actions/cache@v4
      with:
       path: |
         ~/.rustup
         ~/.cargo
         ./target
       key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: install cargo-mutants
      run: cargo install cargo-mutants  --version 27.1.0 --locked
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Generate diff
      run: |
            git branch -av
            git diff origin/${{ github.base_ref }}.. | tee git.diff

    - name: Mutants
      run: |
          # Exit codes: 0 => all mutants killed. 3=> All killed or timed out 
          #https://mutants.rs/exit-codes.html?highlight=exi#exit-codes
            cargo mutants --test-workspace true --no-shuffle -vV --in-diff git.diff  || [ $? -eq 3 ]
