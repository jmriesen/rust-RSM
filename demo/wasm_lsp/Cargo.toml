[package]
name = "wasm_lsp"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.103"
tokio = { version = "1.53.1", default-features=false, features = ["io-util","rt"] }
tower-lsp = "0.20.0"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["console"] }
lang-server = {path ="../../lang-server/"}
monaco-tower-lsp-bridge = {path ="../../../monaco-tower-lsp-bridge/"}

